services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoguide_user
      POSTGRES_PASSWORD: ecoguide_pass
      POSTGRES_DB: ecoguide_kakamega
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://ecoguide_user:ecoguide_pass@db:5432/ecoguide_kakamega
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
